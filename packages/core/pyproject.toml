[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forensics-core"
version = "0.1.0"
description = "Core library for forensic toolkit"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]